<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | GoWheels </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f5f3;
            font-family: Arial, sans-serif;
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #777;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-register {
            background: #111;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            width: 100%;
        }

        .btn-register:hover {
            background: #333;
            color: white;
        }

        .login-link {
            color: #111;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="register-wrapper">

    <div class="register-card">

        <div class="text-center mb-4">

            <div class="brand">
                GoWheels
            </div>

            <p class="subtitle mb-0">
                Create your account
            </p>

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-register"
            >
                Create Account
            </button>

        </form>


        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a
                href="{% url 'login' %}"
                class="login-link"
            >
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
