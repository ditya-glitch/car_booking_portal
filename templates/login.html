<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GoWheels - Car Booking Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f6f9;
        }

        .login-container {
            max-width: 450px;
            margin: 80px auto;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }

        .register-link {
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="login-container">

        <div class="login-card">

            <h2 class="login-title">
                Login
            </h2>

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-login"
                >
                    Login
                </button>

            </form>

            <div class="text-center mt-4">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="{% url 'register' %}"
                    class="register-link"
                >
                    Register
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
